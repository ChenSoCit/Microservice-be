server.port=8083

spring.application.name=api-gateway
spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Route cho Auth Service (qua client-server)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://client-server
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# Route cho Product Service (qua client-server)
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://client-server
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# Route cho Order Service (qua client-server)
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://client-server
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# Route cho User Service (qua client-server)
spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=lb://client-server
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# Fallback route - tất cả API còn lại vào client-server
spring.cloud.gateway.routes[4].id=client-server-fallback
spring.cloud.gateway.routes[4].uri=lb://client-server
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0
